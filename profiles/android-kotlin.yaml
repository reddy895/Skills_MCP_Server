guidelines:
  - "Unidirectional Data Flow (UDF): Drive UI state through immutable StateFlow data streams emitted from ViewModels, ensuring events flow upward and state flows downward."
  - "ViewModel state holding: Retain state across configuration changes within Android ViewModels; avoid passing Activity or Context references into ViewModel logic."
  - "Compose recomposition optimization: Mark stable immutable data classes with @Immutable or @Stable, defer state reads to layout/draw phases, and use remember/derivedStateOf to prevent unnecessary recompositions."
  - "Database isolation: Perform Room database operations strictly off the main thread using Coroutines with Dispatchers.IO, encapsulating queries in clean Repository interfaces."
  - "Dependency injection: Enforce compile-time dependency injection using Hilt (@HiltAndroidApp, @AndroidEntryPoint) for modular, testable application architecture."
